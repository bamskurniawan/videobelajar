<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Videobelajar</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
    <div class="logo">
        videobelajar
    </div>
</header>
<main class="login-page">
<div class="login-card">
<h1>
Masuk ke Akun
</h1>
<p class="subtitle">
Yuk, lanjutkan belajarmu di videobelajar.
</p>
<form id="loginForm">
<label>
E-Mail <span>*</span>
</label>
<input 
type="email"
placeholder=""
required
>
<label>
Kata Sandi <span>*</span>
</label>
<div class="password-box">
<input 
type="password"
id="password"
>
<button type="button" id="showPassword">
👁
</button>
</div>
<div class="forgot">
<a href="#">
Lupa Password?
</a>
</div>
<button class="btn-login">
Masuk
</button>
<button class="btn-register">
Daftar
</button>
<div class="divider">
<span></span>
atau
<span></span>
</div>
<button class="google-btn">
<img src="assets/google.jpg">
Masuk dengan Google
</button>
</form>
</div>
</main>
<script src="js/script.js"></script>
</body>
</html>
